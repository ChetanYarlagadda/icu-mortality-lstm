[project]
name = "icu-mortality-lstm"
version = "1.0.0"
description = "ICU mortality from irregular vital-sign time series: XGBoost on summary features vs LSTM, GRU and GRU-D on the PhysioNet/CinC Challenge 2012 data."
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
